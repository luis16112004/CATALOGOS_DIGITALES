<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mi Catálogo · Olimpo 50</title>
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mi Catálogo">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="iconos/favicon.png">
  <link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Allura&family=Bodoni+Moda:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Dancing+Script:wght@500;600&family=Exo+2:ital,wght@0,600;0,700;1,600;1,700;1,800&family=Great+Vibes&family=Josefin+Sans:wght@300;400;500;600&family=Lato:wght@300;400;700&family=Marcellus&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Nunito+Sans:wght@300;400;500;600;700&family=Parisienne&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Poppins:wght@300;400;500;600&family=Raleway:wght@300;400;500;600&family=Sacramento&display=swap">
  <link rel="stylesheet" href="css/catalogo.css?v=6">
  <link rel="stylesheet" href="css/app.css?v=6">
</head>
<body>
  <div class="app" id="app" data-movil="productos" data-html2canvas-ignore>
    <header class="barra">
      <div class="barra-marca">
        <span class="barra-logo" id="barra-logo"></span>
        <div>
          <div class="barra-titulo">Mi Catálogo</div>
          <div class="barra-sub">Olimpo 50</div>
        </div>
      </div>
      <div class="barra-acciones">
        <span class="estado-guardado" id="estado-guardado" data-estado="ok"><i></i><span>Guardado</span></span>
        <div class="menu-mas">
          <button class="btn btn-linea" id="btn-mas" aria-haspopup="true" aria-expanded="false" aria-controls="menu-mas">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
            <span class="solo-escritorio">Más</span>
          </button>
          <div class="menu" id="menu-mas" role="menu" hidden>
            <button role="menuitem" data-acc="imprimir">Imprimir catálogo</button>
            <button role="menuitem" data-acc="respaldo-guardar">Guardar respaldo (archivo)</button>
            <button role="menuitem" data-acc="respaldo-cargar">Cargar un respaldo</button>
            <hr>
            <button role="menuitem" data-acc="restaurar" class="peligro">Volver al catálogo de ejemplo</button>
          </div>
        </div>
        <button class="btn btn-rosa" id="btn-pdf" data-acc="pdf">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19.5h14"/></svg>
          <span><span class="solo-escritorio">Descargar </span>PDF</span>
        </button>
      </div>
    </header>

    <div class="cuerpo">
      <aside class="panel" id="panel">
        <nav class="pestanas" role="tablist" aria-label="Secciones del editor">
          <button role="tab" class="pestana" data-pestana="productos" aria-selected="true">Productos</button>
          <button role="tab" class="pestana" data-pestana="diseno" aria-selected="false">Diseño</button>
          <button role="tab" class="pestana" data-pestana="textos" aria-selected="false">Textos</button>
        </nav>
        <div class="panel-scroll" id="panel-scroll">
          <section class="tab" id="tab-productos" role="tabpanel"></section>
          <section class="tab" id="tab-diseno" role="tabpanel" hidden></section>
          <section class="tab" id="tab-textos" role="tabpanel" hidden></section>
        </div>
      </aside>

      <main class="vista" id="vista">
        <div class="vista-barra">
          <div><b>Vista previa</b> <span id="vista-info"></span></div>
          <span class="vista-pista">Toca un producto para editarlo</span>
        </div>
        <div class="vista-scroll" id="vista-scroll">
          <div class="vista-paginas" id="vista-paginas"></div>
        </div>
      </main>
    </div>

    <nav class="nav-movil" aria-label="Secciones">
      <button data-movil="productos" class="activo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>
        Productos
      </button>
      <button data-movil="diseno">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5a8.5 8.5 0 1 0 0 17c1.2 0 1.8-.9 1.4-1.9-.4-1 .2-2.1 1.3-2.1h2.1a3.7 3.7 0 0 0 3.7-3.7c0-5.1-3.8-9.3-8.5-9.3z"/><circle cx="7.8" cy="11" r="1.1"/><circle cx="10.5" cy="7.3" r="1.1"/><circle cx="15" cy="7.6" r="1.1"/></svg>
        Diseño
      </button>
      <button data-movil="textos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6.5V5h14v1.5M12 5v14m-3 0h6"/></svg>
        Textos
      </button>
      <button data-movil="catalogo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h8.5L19 8v12.5H6z"/><path d="M14 3.5V8h5M9 12.5h6M9 16h6"/></svg>
        Ver catálogo
      </button>
    </nav>
  </div>

  <!-- Ventanas -->
  <div class="modal-fondo" id="modal-producto" hidden></div>
  <div class="modal-fondo" id="modal-confirmar" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="capa" id="capa-pdf" hidden data-html2canvas-ignore>
    <div class="capa-caja">
      <div class="capa-logo" id="capa-logo"></div>
      <p id="capa-texto">Preparando tu catálogo…</p>
      <div class="capa-barra"><i id="capa-progreso"></i></div>
      <small>No cierres esta ventana</small>
    </div>
  </div>

  <!-- Aquí se dibujan las hojas a tamaño real para crear el PDF o imprimir -->
  <div class="exportar" id="exportar" aria-hidden="true"></div>

  <input type="file" id="archivo" accept="image/*" hidden>
  <input type="file" id="archivo-respaldo" accept=".json,application/json" hidden>
  <datalist id="lista-categorias"></datalist>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="js/fotos-ejemplo.js?v=6"></script>
  <script src="js/datos.js?v=6"></script>
  <script src="js/catalogo.js?v=6"></script>
  <script src="js/app.js?v=6"></script>
</body>
</html>
